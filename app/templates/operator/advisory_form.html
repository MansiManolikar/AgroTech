{% extends "shared/base.html" %}

{% block title %}Publish Advisory — CropIQ{% endblock %}

{% block content %}

<div class="page-header">

  <div>

    <h1 class="page-title">Publish Advisory</h1>

    <p class="page-sub">Create and publish an advisory — subscribed farmers will be notified</p>

  </div>

  <a href="{{ url_for('operator.advisories') }}" class="btn btn-secondary">&#8592; Back</a>

</div>

<div class="card" style="max-width:700px">

  <form method="POST" action="{{ url_for('operator.add_advisory') }}">

    <div class="form-group">

      <label>Zone *</label>

      <select name="zone_id" required>

        <option value="">Select a zone</option>

        {% for z in zones %}

        <option value="{{ z.id }}" {% if form.get('zone_id','') == z.id|string %}selected{% endif %}>

          {{ z.farmer_name }} — {{ z.farm_name }} — {{ z.zone_name }}

        </option>

        {% endfor %}

      </select>

    </div>

    <div class="form-row">

      <div class="form-group">

        <label>Advisory Type *</label>

        <select name="advisory_type">

          <option value="irrigation" {% if form.get('advisory_type','') == 'irrigation' %}selected{% endif %}>Irrigation</option>

          <option value="nutrient"   {% if form.get('advisory_type','') == 'nutrient'   %}selected{% endif %}>Nutrient</option>

          <option value="pest"       {% if form.get('advisory_type','') == 'pest'       %}selected{% endif %}>Pest Control</option>

        </select>

      </div>

      <div class="form-group">

        <label>Crop Stage</label>

        <select name="crop_stage">

          <option value="">All stages</option>

          {% for stage in ['Germination','Seedling','Vegetative','Flowering','Grain Fill','Maturity','Harvest'] %}

          <option {% if form.get('crop_stage','') == stage %}selected{% endif %}>{{ stage }}</option>

          {% endfor %}

        </select>

      </div>

    </div>

    <div class="form-group">

      <label>Advisory Title *</label>

      <input type="text" name="title" value="{{ form.get('title','') }}"

             placeholder="e.g. Increase drip frequency during flowering stage" required/>

    </div>

    <div class="form-group">

      <label>Advisory Content *</label>

      <textarea name="content" rows="5" placeholder="Provide detailed instructions, dosage, timing and any precautions..." required>{{ form.get('content','') }}</textarea>

    </div>

    <div style="display:flex;gap:10px">

      <button type="submit" class="btn btn-primary">&#128203; Publish Advisory</button>

      <a href="{{ url_for('operator.advisories') }}" class="btn btn-secondary">Cancel</a>

    </div>

  </form>

</div>

{% endblock %}
