{% extends "shared/base.html" %}
{% block title %}Register — CropIQ Portal{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-logo">&#127807;</div>
  <h1 class="auth-title">Create account</h1>
  <p class="auth-sub">Join the Smart Crop Insights & Irrigation Portal</p>
  <form method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" value="{{ form.get('name','') }}" placeholder="Ravi Kumar" required/>
      </div>
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" value="{{ form.get('phone','') }}" placeholder="+91 9999999999"/>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" value="{{ form.get('email','') }}" placeholder="you@example.com" required/>
    </div>
    <div class="form-group">
      <label for="role">Account type</label>
      <select id="role" name="role">
        <option value="farmer"   {% if form.get('role','farmer')=='farmer'   %}selected{% endif %}>Farmer</option>
        <option value="operator" {% if form.get('role','farmer')=='operator' %}selected{% endif %}>Agronomist Operator</option>
      </select>
    </div>
    <div class="form-group">
      <label for="language">Preferred language</label>
      <select id="language" name="language">
        <option value="en" {% if form.get('language','en')=='en' %}selected{% endif %}>English</option>
        <option value="hi" {% if form.get('language','en')=='hi' %}selected{% endif %}>Hindi</option>
        <option value="kn" {% if form.get('language','en')=='kn' %}selected{% endif %}>Kannada</option>
        <option value="te" {% if form.get('language','en')=='te' %}selected{% endif %}>Telugu</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Min 8 characters" required/>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required/>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Create Account</button>
  </form>
  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</div>
{% endblock %}
